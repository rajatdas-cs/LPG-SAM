<text x="60" y="214.2" font-size="15" fill="#1e1e1e" opacity="1.0">The prior is a hand-built filter, not a learned module - so it costs nothing at inference</text>
<text x="60" y="233.0" font-size="15" fill="#1e1e1e" opacity="1.0">and carries no dataset bias of its own. It is a strong hypothesis about where vessels are,</text>
<text x="60" y="264.2" font-size="15" fill="#1e1e1e" opacity="1.0">and a poor segmenter on its own: clDice 0.284 at its best threshold, with the vessel tree</text>
<text x="60" y="283.0" font-size="15" fill="#1e1e1e" opacity="1.0">shattered into roughly 4,900 components per image. The adapter is what turns one into the other.</text>
